<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkNotes</title>
</head>
<body>
  <aside class="sidebar">
    <div class="logo-block">PinkNotes</div>
    <button class="btn-add-project" id="openProjectModal">
      + Add Project
    </button>
    <ul class="project-list"></ul>
  </aside>

  <main>
    </main>

  <div class="modal-overlay" id="projectModal">
    <div class="modal-card">
      <h3 class="modal-title">Create Project</h3>
      <input type="text" class="modal-input" placeholder="Project name...">
      
      <div class="color-picker">
        <span class="color-option selected" style="background: var(--project-focus);"></span>
        <span class="color-option" style="background: var(--project-business);"></span>
        <span class="color-option" style="background: var(--project-home);"></span>
        <span class="color-option" style="background: var(--project-urgent);"></span>
        <span class="color-option" style="background: var(--project-creative);"></span>
        <span class="color-option" style="background: var(--project-shopping);"></span>
        <span class="color-option" style="background: var(--project-chill);"></span>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="closeProjectModal">Cancel</button>
        <button class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="taskModal">
    <div class="modal-card">
      <h3 class="modal-title">Create Task</h3>
      <input type="text" class="task-modal-input modal-input" placeholder="Task title...">
      <input type="date" class="task-modal-date modal-input">
      
      <label style="font-size: 14px; font-weight: 700; color: var(--text-main);">Priority:</label>
      <div class="priority-picker color-picker">
        <span class="priority-option color-option selected" data-color="var(--priority-low)" style="background: var(--priority-low);"></span>
        <span class="priority-option color-option" data-color="var(--priority-medium)" style="background: var(--priority-medium);"></span>
        <span class="priority-option color-option" data-color="var(--priority-high)" style="background: var(--priority-high);"></span>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="closeTaskModal">Cancel</button>
        <button class="btn-primary" id="createTaskBtn">Add Task</button>
      </div>
    </div>
  </div>
</body>
</html>
